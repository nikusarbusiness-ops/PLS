name: Build Spigot Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Plugin mit Maven kompilieren
        run: |
          POM_PATH=$(find . -name "pom.xml" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "FEHLER: Keine pom.xml im Repository gefunden!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$POM_PATH")
          echo "Kompiliere Projekt in: $PROJECT_DIR"
          mvn -f "$POM_PATH" -B clean package

      - name: Fertige JAR-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CorePlugin-1.21.11
          path: "**/target/CorePlugin-*.jar"
