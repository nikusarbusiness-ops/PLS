name: Build Spigot Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Plugin mit Maven kompilieren
        run: mvn -B clean package

      - name: Prüfen ob plugin.yml in der JAR liegt
        run: |
          JAR_FILE=$(ls target/CorePlugin-*.jar | head -n 1)
          echo "Prüfe $JAR_FILE"
          jar tf "$JAR_FILE" | grep "plugin.yml"

      - name: Fertige JAR-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CorePlugin-1.21.11
          path: target/CorePlugin-*.jar
